name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/kubeorch/core

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  smoke:
    name: Smoke (${{ matrix.platform }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: kubeorch/core:release-smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=core-container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-container-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Smoke-test platform image
        run: .github/scripts/smoke-container.sh "kubeorch/core:release-smoke-${{ matrix.arch }}" "${{ matrix.arch }}"

  release:
    name: Publish attested image
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.title=KubeOrch Core
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest the release index
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify platforms and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --raw > image-index.json
          actual_platforms="$(
            jq -r '[
              .manifests[]
              | .platform
              | select(.os != "unknown")
              | "\(.os)/\(.architecture)"
            ] | unique | sort | join(",")' image-index.json
          )"
          if [ "$actual_platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Unexpected runnable platforms: $actual_platforms" >&2
            exit 1
          fi

          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{ json .SBOM }}' > sbom.json
          jq -e 'type == "object" and length > 0' sbom.json > /dev/null

          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{ json .Provenance.SLSA }}' > provenance.json
          jq -e 'type == "object" and length > 0' provenance.json > /dev/null
          grep -F "$GITHUB_SHA" provenance.json > /dev/null

          gh attestation verify "oci://$IMAGE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-from-oci \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docker-publish.yml" \
            --source-digest "$GITHUB_SHA"

      - name: Promote verified image to latest
        env:
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${EXPECTED_DIGEST}"

          promoted_digest="$(
            docker buildx imagetools inspect "${IMAGE_NAME}:latest" \
              --format '{{ .Manifest.Digest }}'
          )"
          if [ "$promoted_digest" != "$EXPECTED_DIGEST" ]; then
            echo "latest points to $promoted_digest, expected $EXPECTED_DIGEST" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## Docker Image

            Supported platforms: `linux/amd64`, `linux/arm64`

            Source commit: `${{ github.sha }}`

            Immutable image:

            ```bash
            docker pull ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
            ```

            Verify the published evidence:

            ```bash
            docker buildx imagetools inspect ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
            docker buildx imagetools inspect ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }} --format '{{ json .SBOM }}'
            docker buildx imagetools inspect ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }} --format '{{ json .Provenance.SLSA }}'
            gh attestation verify oci://${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }} --repo ${{ github.repository }} --bundle-from-oci --signer-workflow ${{ github.repository }}/.github/workflows/docker-publish.yml --source-digest ${{ github.sha }}
            ```

            Run with `orchcli`:
            ```bash
            orchcli init && orchcli start -d
            ```
