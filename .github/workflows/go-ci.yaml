name: Go CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: tools/openapi/go.sum

      - name: Download dependencies
        run: go -C tools/openapi mod download

      - name: Run compatibility fixtures
        run: go -C tools/openapi test ./...

      - name: Validate OpenAPI contract
        run: go -C tools/openapi run . validate ../../docs/openapi.yaml

      - name: Reject breaking changes
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: go -C tools/openapi run . breaking-ref "$OPENAPI_BASE_REF" docs/openapi.yaml ../../docs/openapi.yaml

  ci:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          args: --timeout=5m

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -v .

  container:
    name: Container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: kubeorch/core:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=core-container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=core-container-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Smoke-test platform image
        run: .github/scripts/smoke-container.sh "kubeorch/core:smoke-${{ matrix.arch }}" "${{ matrix.arch }}"
